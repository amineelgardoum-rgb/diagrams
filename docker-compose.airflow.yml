# Airflow 3.3.2 add-on for the monitoring stack (Alloy -> Loki -> MinIO, Grafana).
# Run from the project root:
#   docker compose -f docker-compose.yml -f airflow/docker-compose.airflow.yml up -d --build
# Login: admin / admin  (dev only, change it for anything exposed)
# Airflow 3 services: api-server (UI + API), scheduler, dag-processor.
# (A triggerer is only needed for deferrable operators; these DAGs don't use any.)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile_inline: |
      FROM apache/airflow:3.3.2
      RUN pip install --no-cache-dir docker requests boto3 pandas pyarrow
  image: monitoring-airflow:3.3.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # must be identical in every Airflow container
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-this-to-a-long-random-secret-0123456789}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-change-this-too-0123456789abcdef}
    # Airflow 3 default auth manager: username:role (password is set in the api-server command)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: admin
    MINIO_SECRET_KEY: adminpassword
    LOKI_URL: http://loki:3100
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock   # lets DAGs restart containers
  group_add:
    - "${DOCKER_GID:-999}"                         # run: getent group docker | cut -d: -f3
  networks: [monitoring]
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    networks: [monitoring]

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    # SimpleAuthManager reads passwords from this file; we write admin/admin before starting
    command:
      - bash
      - -c
      - |
        echo '{"admin": "admin"}' > /opt/airflow/simple_auth_manager_passwords.json.generated
        exec airflow api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
  airflow-logs:

networks:
  monitoring:
    external: true
    name: monitoring   # <- change to your stack's network name