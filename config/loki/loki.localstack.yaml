# Same schema as loki.yaml, but storage lives in LocalStack S3 (emulator)
# instead of MinIO. Used by docker-compose.localstack.yml.
auth_enabled: false

server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
     s3:
      endpoint: localstack-aws:4566
      bucketnames: loki-data
      access_key_id: test
      secret_access_key: test
      s3forcepathstyle: true
      insecure: true

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true

# Speed things up for testing: roll chunks every 2 minutes (default 2h) so
# objects show up in S3 quickly. flush-on-shutdown is passed as a CLI flag in
# docker-compose.localstack.yml (no YAML key in Loki 3.4).
ingester:
  max_chunk_age: 2m
