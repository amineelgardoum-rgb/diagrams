apiVersion: 1

# Alert rules on the level label produced by Alloy.
# Notifications go to Grafana's default contact point (bell / Alerting UI).
ruleGroups:
  - orgId: 1
    name: logs-alerting
    folder: Observability
    interval: 1m
    rules:
      - uid: log-error-rate
        title: "Logs: ERROR burst"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum by (service) (count_over_time({level="ERROR"}[5m]))
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.service }} logged more than 3 ERROR lines in 5 minutes"
          description: >-
            Error burst detected for {{ $labels.service }}.
            Open Explore and run the query for level ERROR on this service.
        labels:
          severity: error
        isPaused: false

      - uid: log-warn-rate
        title: "Logs: WARN burst"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum by (service) (count_over_time({level="WARN"}[5m]))
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              refId: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.service }} logged more than 20 WARN lines in 5 minutes"
          description: >-
            Sustained warnings from {{ $labels.service }}, worth a look before
            they turn into errors.
        labels:
          severity: warning
        isPaused: false